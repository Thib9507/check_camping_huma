name: Vérifier disponibilité billets

on:
  schedule:
    # 5 minutes est le plancher accepté par GitHub, et en pratique les runs
    # planifiés sont retardés bien au-delà. Ce cron ne fixe donc pas la
    # cadence réelle : c'est la boucle interne du script (POLL_SECONDS) qui
    # la fixe. Le cron sert surtout à relancer la boucle quand elle se
    # termine, ou à la redémarrer si GitHub en a sauté une.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permet de lancer le check manuellement depuis l'onglet Actions

# Un seul run à la fois : sans ça, chaque déclenchement du cron empilerait
# une boucle supplémentaire et on interrogerait le site en double.
concurrency:
  group: veille-camping
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Garde-fou : si la boucle partait en vrille, le job est coupé net.
    timeout-minutes: 20
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # La clé doit être unique à chaque run : actions/cache ne ré-enregistre
      # PAS le cache quand la clé correspond exactement à un cache existant.
      # Avec une clé fixe, last_count.txt resterait figé sur la valeur du tout
      # premier run, et on ne détecterait plus jamais de changement.
      - name: Restaurer le compteur précédent (cache)
        uses: actions/cache@v4
        with:
          path: last_count.txt
          key: camping-count-${{ github.run_id }}
          restore-keys: |
            camping-count-

      - name: Lancer la vérification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POLL_SECONDS: "60"
          LOOP_MINUTES: "15"
        run: python check_tickets.py
